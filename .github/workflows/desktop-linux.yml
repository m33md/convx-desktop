name: Desktop build (Linux)

# The Linux app as a .deb (Ubuntu, Debian, Mint), an .rpm (Fedora, openSUSE) and an AppImage (any
# other), for x64 and ARM computers. Each is built on a runner of its own kind, because the app
# bundles FFmpeg and the Java runtime for the machine it is packaged on (desktop/build.gradle.kts
# picks the linux-x86_64 or linux-arm64 natives). desktop.yml runs it beside the Windows and Mac
# builds on every push.
on:
  workflow_call:
    inputs:
      linuxes:
        description: The machines to build on, as a JSON list of {arch, runner}.
        type: string
        # Ubuntu 22.04, so the .deb asks for the libraries by the names older systems use too
        # (newer ones provide them under those names). The ARM one is optional, as the Apple Silicon Mac is.
        default: '[{"arch":"x64","runner":"ubuntu-22.04"},{"arch":"arm64","runner":"ubuntu-22.04-arm","optional":true}]'

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linuxes) }}
    defaults:
      run:
        working-directory: desktop
    env:
      # The packages' own number, which only goes up, as the Windows and Mac ones do.
      CONVX_PACKAGE_VERSION: 1.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the version number is counted from it.
          fetch-depth: 0

      # The same number desktop.yml gives the Windows build.
      - name: Version
        run: |
          cd "$GITHUB_WORKSPACE"
          version=$(bash .github/scripts/convx-version.sh)
          echo "Convx $version"
          echo "CONVX_VERSION=$version" >> "$GITHUB_ENV"

      # rpmbuild for the .rpm, desktop-file-validate for the AppImage; a virtual screen, a window
      # manager and screenshots for the try.
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm fakeroot file desktop-file-utils xvfb openbox x11-utils imagemagick > /dev/null

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compile
        run: ./gradlew --no-daemon compileKotlin

      - name: Package the app, the .deb and the .rpm
        run: ./gradlew --no-daemon createDistributable packageDeb packageRpm

      - name: Make the AppImage
        run: bash packaging/linux/make-appimage.sh build/compose/binaries/main/app/Convx src/main/resources/convx.png build/Convx-linux-${{ matrix.arch }}.AppImage

      - name: Name the packages
        run: |
          cp build/compose/binaries/main/deb/*.deb build/Convx-linux-${{ matrix.arch }}.deb
          cp build/compose/binaries/main/rpm/*.rpm build/Convx-linux-${{ matrix.arch }}.rpm
          ls -l build/Convx-linux-*

      # The checks the Windows build runs, on Linux: decoding, the library, AutoMix and the rest,
      # and the Google sign-in with each browser this runner has (Chrome and Firefox).
      - name: Playback check
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p build/check
          xvfb-run -a -s "-screen 0 1600x1000x24" ./gradlew --no-daemon -q playbackCheck 2>&1 | tee build/check/playback-check.txt
          exit ${PIPESTATUS[0]}

      # Installed and opened on this machine as a person would, and installed on Debian and Fedora.
      - name: Try the app
        id: tryapp
        continue-on-error: true
        timeout-minutes: 15
        run: bash packaging/linux/try-app.sh build/compose/binaries/main/app/Convx build/Convx-linux-${{ matrix.arch }}.deb build/Convx-linux-${{ matrix.arch }}.rpm build/Convx-linux-${{ matrix.arch }}.AppImage build/check

      # The release takes the packages only from a build that installed and opened.
      - uses: actions/upload-artifact@v4
        if: steps.tryapp.outcome == 'success'
        with:
          name: Convx-linux-${{ matrix.arch }}-packages
          path: |
            desktop/build/Convx-linux-${{ matrix.arch }}.deb
            desktop/build/Convx-linux-${{ matrix.arch }}.rpm
            desktop/build/Convx-linux-${{ matrix.arch }}.AppImage
          compression-level: 0
          overwrite: true
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Convx-linux-${{ matrix.arch }}-check
          path: desktop/build/check
          overwrite: true
          if-no-files-found: ignore

  # Each machine's screenshots, the app's log and the package checks on the convx-linux-snapshots
  # branch, so they can be looked at without the run's artifacts. Off main, the x64 packages also
  # go to the refs/convx-builds/linux ref (in parts under GitHub's 100 MB file limit), where a
  # test copy can be fetched with git; nothing there is on the download page.
  results:
    name: Linux results
    needs: linux
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Convx-linux-*-check
          path: check

      - name: Publish the screenshots
        working-directory: check
        run: |
          [ -n "$(ls -A)" ] || exit 0
          git init -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Linux screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" snapshots:convx-linux-snapshots

      - uses: actions/download-artifact@v4
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        with:
          name: Convx-linux-x64-packages
          path: packages

      - name: Keep a test copy
        if: github.ref != 'refs/heads/main' && hashFiles('packages/*') != ''
        working-directory: packages
        run: |
          sha256sum Convx-* > SHA256SUMS
          for file in Convx-*; do
            split -b 90m -d -a 2 "$file" "$file.part"
            rm "$file"
          done
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Linux test build of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds:refs/convx-builds/linux
