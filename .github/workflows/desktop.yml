name: Desktop build

on:
  push:
    paths:
      - "installer/**"
      - "desktop/**"
      - "innertube/**"
      - "lyrics/**"
      - "canvas/**"
      - "integrations/**"
      - "spine/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-macos.yml"
  pull_request:
    paths:
      - "installer/**"
      - "desktop/**"
      - "innertube/**"
      - "lyrics/**"
      - "canvas/**"
      - "integrations/**"
      - "spine/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-macos.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # Screenshots are pushed to the convx-desktop-snapshots branch.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      # Whether Convx's own setup passed its try on this runner (the release offers it only then).
      setup: ${{ steps.trysetup.outcome }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      # The installers' own number, which only goes up, so each one upgrades the Convx installed
      # before it. 1.1, because the 1.0 builds (up to 1.0.75) came from m33md/anything. People see
      # CONVX_VERSION instead (the Version step below).
      CONVX_PACKAGE_VERSION: 1.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the version number is counted from it.
          fetch-depth: 0

      # The version people see (.github/scripts/convx-version.sh).
      - name: Version
        id: version
        run: |
          cd "$GITHUB_WORKSPACE"
          version=$(bash .github/scripts/convx-version.sh)
          echo "Convx $version (installer $CONVX_PACKAGE_VERSION)"
          echo "CONVX_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The runtime the installer ships: the JetBrains Runtime has the custom title bar the
      # app's top bar replaces Windows' with. Set up first so Temurin stays the build's Java.
      - uses: actions/setup-java@v5
        id: jbr
        continue-on-error: true
        with:
          distribution: jetbrains
          java-version: "21"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Branch builds keep their dependency cache too, not only the default branch.
          cache-read-only: false

      - name: Compile
        run: ./gradlew --no-daemon compileKotlin

      # The YouTube Music login is tried with every browser on the runner; Opera GX is added to
      # Chrome, Edge and Firefox, because it's the one people asked about.
      - name: Install Opera GX
        continue-on-error: true
        timeout-minutes: 6
        shell: powershell
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'OperaGXSetup.exe'
          Invoke-WebRequest -UseBasicParsing 'https://net.geo.opera.com/opera_gx/stable/windows' -OutFile $setup
          Start-Process -Wait -FilePath $setup -ArgumentList '--silent', '--allusers=0', '--launchopera=0', '--setdefaultbrowser=0'
          Get-ChildItem "$env:LOCALAPPDATA\Programs\Opera GX" -Filter opera.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

      - name: Playback check
        continue-on-error: true
        timeout-minutes: 12
        # Kept beside the screenshots, so the results can be read without the run's logs.
        run: |
          mkdir -p build/snapshots
          ./gradlew --no-daemon -q playbackCheck 2>&1 | tee build/snapshots/playback-check.txt
          exit ${PIPESTATUS[0]}

      - name: Screenshots
        id: snapshots
        continue-on-error: true
        timeout-minutes: 25
        run: |
          status=0
          ./gradlew --no-daemon snapshots || status=$?
          mkdir -p build/snapshots
          cp "$(cygpath -u "$LOCALAPPDATA")"/Convx/logs/*.log build/snapshots/ || true
          exit $status

      - name: Package installers
        env:
          CONVX_JBR: ${{ steps.jbr.outputs.path }}
        run: |
          if [ -n "$CONVX_JBR" ]; then
            echo "Packaging with the JetBrains Runtime at $CONVX_JBR"
            ls "$CONVX_JBR" "$CONVX_JBR/jmods" | head -20 || true
            ./gradlew --no-daemon packageMsi packageExe createDistributable && exit 0
            echo "::warning::Packaging with the JetBrains Runtime failed; falling back to Temurin (Windows title bar)"
          fi
          CONVX_JBR= ./gradlew --no-daemon packageMsi packageExe createDistributable

      # What Convx costs while it sits paused and while its page is scrolled (CPU, memory, frames
      # drawn, a CPU profile), for this build and for the release people have now, side by side in
      # the screenshots' idle folder.
      - name: Idle check
        continue-on-error: true
        timeout-minutes: 18
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          JBR: ${{ steps.jbr.outputs.path }}
        run: |
          $out = 'build/snapshots/idle'
          New-Item -ItemType Directory -Force $out | Out-Null
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Screen size unchanged: $_" }
          $base = Join-Path $env:RUNNER_TEMP 'release'
          gh release download desktop-latest --repo $env:GITHUB_REPOSITORY --pattern '*-portable.zip' --dir $base --clobber
          $zip = Get-ChildItem $base -Filter *-portable.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) {
            Expand-Archive -Force $zip.FullName $base
            ./packaging/windows/idle-check.ps1 -App (Join-Path $base 'Convx') -Name "release-$($zip.BaseName -replace '^Convx-|-portable$')" -OutDir $out -Jdk $env:JBR
          }
          ./packaging/windows/idle-check.ps1 -App build/compose/binaries/main/app/Convx -Name "build-$env:CONVX_VERSION" -OutDir $out -Jdk $env:JBR

      # Convx's pictures in the installer's pages, and "Updating Convx" over an older install.
      # The script keeps the MSI as jpackage made it if anything looks off.
      - name: Brand the installer
        continue-on-error: true
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          ./packaging/windows/brand-msi.ps1 -Msi $msi.FullName -Banner packaging/windows/banner.bmp -Dialog packaging/windows/dialog.bmp

      # The setup .exe: Convx's icon instead of Java's, and the branded MSI above inside it.
      - name: Brand the setup exe
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          $msi = Get-ChildItem build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          ./packaging/windows/brand-exe.ps1 -Exe $exe.FullName -Msi $msi.FullName -Icon src/main/resources/convx.ico

      # Convx's own setup window (installer/windows), around the branded MSI. It's tried on this
      # runner like a person would (update, uninstall, a failure, the updater's /passive run) and only
      # published if every step works; otherwise the release keeps the MSI and jpackage's .exe.
      - name: Build the setup
        id: setup
        continue-on-error: true
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          ../installer/windows/build-bundle.ps1 -Msi $msi.FullName -Version $env:CONVX_PACKAGE_VERSION -DisplayVersion $env:CONVX_VERSION -Icon src/main/resources/convx.ico -Out build/setup/Convx-Setup.exe

      - name: Try the setup
        id: trysetup
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          # The setup on the download page, unless it came from this same commit: this one has to
          # update a Convx it installed, so people who run it over the last version see Update.
          # gh's messages on stderr would stop Windows PowerShell here, and a missing setup only skips that try.
          $ErrorActionPreference = 'Continue'
          $previous = ''
          $notes = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/desktop-latest" --jq .body 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -and -not ($notes -match $env:GITHUB_SHA)) {
            gh release download desktop-latest -R $env:GITHUB_REPOSITORY -p 'Convx-Setup-*.exe' -D build/download-page --clobber 2>&1 | Write-Host
            $found = Get-ChildItem build/download-page/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $previous = $found.FullName; Write-Host "Updating over $($found.Name) from the download page" }
          }
          if (-not $previous) { Write-Host '::warning::No setup from another commit on the download page to update over' }
          $ErrorActionPreference = 'Stop'
          ../installer/windows/preview.ps1 -Setup build/setup/Convx-Setup.exe -Msi $msi.FullName -OutDir build/snapshots/setup -Previous $previous

      - name: Publish screenshots
        if: github.event_name == 'push' && hashFiles('desktop/build/snapshots/**') != ''
        continue-on-error: true
        working-directory: desktop/build/snapshots
        run: |
          git init -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" snapshots:convx-desktop-snapshots

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/Convx -DestinationPath build/Convx-portable-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Convx-windows-installers
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/setup/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Convx-windows-portable
          path: desktop/build/Convx-portable-windows.zip
          if-no-files-found: error

  # The Mac app for Intel and Apple Silicon, built beside the Windows one (desktop-macos.yml).
  macos:
    uses: ./.github/workflows/desktop-macos.yml
    permissions:
      # Its screenshots are pushed to the convx-macos-snapshots branch.
      contents: write
      actions: read

  # GitHub's Apple Silicon Macs are sometimes too busy to take a job at all. When that leaves the
  # run without its Apple Silicon disk image, it gets one more try, on another macOS image, while
  # the Windows build is still going.
  macos-again:
    needs: macos
    if: ${{ !cancelled() && needs.macos.outputs.arm64 != 'true' }}
    uses: ./.github/workflows/desktop-macos.yml
    with:
      macs: '[{"arch":"arm64","runner":"macos-15"}]'
    permissions:
      contents: write
      actions: read

  # The rolling release, refreshed after every build of main: the Windows files, and the Mac disk
  # images next to them when the Mac builds made them (if neither try got an Apple Silicon Mac, the
  # release goes out without that one). Work branches build and take
  # screenshots, but only main reaches the download page; started by hand on another branch, it
  # shows what it would publish and publishes nothing.
  release:
    needs: [windows, macos, macos-again]
    if: ${{ !cancelled() && needs.windows.result == 'success' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The publish script, and the commit whose message becomes the release's "What's new".
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: Convx-windows-*
          path: out/windows

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Convx-macos-*-dmg
          path: out/mac
          merge-multiple: true

      - name: Publish download links
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
          VERSION: ${{ needs.windows.outputs.version }}
          SETUP_OK: ${{ needs.windows.outputs.setup }}
        run: |
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(
            find out/windows -path '*/msi/*.msi'
            find out/windows -path '*/exe/*.exe'
            find out/windows -name 'Convx-portable-windows.zip'
            if [ "$SETUP_OK" = success ]; then find out/windows -name Convx-Setup.exe; fi
            find out/mac -name 'Convx-macos-*.dmg' 2>/dev/null | sort
          )
          printf '%s\n' "${files[@]}"
          bash .github/scripts/publish-desktop-release.sh "$GITHUB_SHA" "$VERSION" "${files[@]}"
